[package]
name = "rscreen"
version = "0.1.1"
edition = "2021"
description = "Multiplexeur de terminal (clone de screen/gnu-screen) en Rust : fenêtres + sélecteur de sessions"
license = "MIT"

[[bin]]
name = "rscreen"
path = "src/main.rs"

[dependencies]
libc = "0.2"
vt100 = "0.18"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
